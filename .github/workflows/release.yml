name: Release
on:
  push:
    branches: [ 'main' ]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'tools/claude/**'
      - 'tools/cursor/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.repository_owner == 'stijnvanhulle'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: ./.github/setup
        with:
          node-version: '22'
          cache: 'false'

      - name: Build
        run: pnpm run build

      # Opens a "Version Packages" PR when changesets are present. Merging it
      # re-triggers this workflow, which then publishes to npm.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # Keeps the Claude and Cursor plugin manifests' version fields in step with
          # the @stijnvanhulle/template-{claude,cursor}-plugin packages Changesets bumps.
          # changesets/action runs this without a shell, so `&&` can't chain
          # commands here — pnpm run does its own shell chaining instead.
          version-script: pnpm run release:version
          publish-script: pnpm release
          commit-message: 'ci(changesets): version packages'
          pr-title: 'ci(changesets): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true
