description = "Get the current branch ready for review and open the pull request"

prompt = """
!{git status --short --branch}

!{git diff --stat origin/main...HEAD}

Get this branch ready for review and open the pull request. Follow
`.agents/skills/pr/SKILL.md` for the full sequence, and treat `{{args}}` as extra context for the
body when it is not empty.

1. Run `pnpm format && pnpm lint:fix && pnpm typecheck && pnpm test` and fix what fails.
2. Add a changeset when the branch touches a published package, or say why it needs none.
3. Commit anything outstanding with a Conventional Commit message.
4. Bring the branch up to date with `git fetch origin main`, then `git push -u origin <branch>`.
5. Derive the title from the branch name as one Conventional Commit line.
6. Open the PR with `gh pr create --base main --assignee @me`, ready for review. Fill every
   section of `.github/pull_request_template.md`, fill the how-to-test steps in place of
   the placeholders, add a label the repo already uses, and tick only the boxes you verified.

Report the PR URL and anything you left unticked.
"""
