description = "Turn a feature's spec and research into its plan.md (architecture + numbered slices) and scaffold the slice files"

prompt = """
Produce the Phase 2 plan for **{{args}}** from `plans/{{args}}/spec.md` and
`plans/{{args}}/research.md`.

1. Confirm the spec exists and its acceptance criteria (`AC-N`) are clear. If not, run `/spec`
   first.
2. If `plans/{{args}}/research.md` is missing, copy it from `plans/templates/research.md` and
   record the key decisions first.
3. Copy `plans/templates/plan.md` to `plans/{{args}}/plan.md` and fill it: overview,
   architecture (layers and responsibilities), and a breakdown into ordered, independently
   demonstrable slices.
4. For each slice, copy `plans/templates/slice.md` to `plans/{{args}}/NNN-<slug>.md` and fill
   its Context, Goal, Prerequisites, Steps, Files touched, Verification, and Done criteria.
5. List the success criteria (all `AC-N` verified, docs updated, changeset added if needed).

This is the Phase 2 step of `.agents/skills/spec-driven/SKILL.md`.
"""
